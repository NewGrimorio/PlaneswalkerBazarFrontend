<div class="centro">
  <mat-card class="scheda">
    <mat-card-header>
      <mat-card-title>Imposta la nuova password</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      @if (esito(); as e) {
        <p class="esito">{{ e }}</p>
        <button matButton="filled" class="campo" (click)="vaiAlLogin()">Vai all'accesso</button>
      } @else if (senzaToken()) {
        <p class="errore">
          Link non valido: apri questa pagina dal percorso
          "Hai dimenticato la password?".
        </p>
        <a routerLink="/password-dimenticata">Richiedi un nuovo reset</a>
      } @else {
        <form (ngSubmit)="invia()">
          <mat-form-field appearance="outline" class="campo">
            <mat-label>Nuova password</mat-label>
            <input matInput type="password" name="password"
                   [(ngModel)]="password" required minlength="8">
          </mat-form-field>

          <mat-form-field appearance="outline" class="campo">
            <mat-label>Conferma password</mat-label>
            <input matInput type="password" name="conferma"
                   [(ngModel)]="conferma" required>
          </mat-form-field>

          @if (errore(); as e) { <p class="errore">{{ e }}</p> }

          <button matButton="filled" type="submit" class="campo" [disabled]="inCorso()">
            {{ inCorso() ? 'Salvataggio…' : 'Imposta password' }}
          </button>
        </form>
      }
    </mat-card-content>
    <mat-card-footer class="footer">
      <a routerLink="/login">Torna all'accesso</a>
    </mat-card-footer>
  </mat-card>
</div>
