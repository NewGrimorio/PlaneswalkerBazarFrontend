<header class="topbar">

  <!-- RIGA ALTA: identita' e strumenti (logo | ricerca | carrello + utente) -->
  <div class="riga-alta">
    <a routerLink="/" class="logo-link">
      <img src="/logo.png" alt="Planeswalker Bazar" class="logo">
      <span class="marchio">Planeswalker<span class="marchio-oro">Bazar</span></span>
    </a>

    <!-- Ricerca globale: pubblica come il catalogo -->
    <app-barra-ricerca class="ricerca-top" />

    <div class="gruppo-destro">
      @if (authS.isAutentificated()) {
        <!-- Carrello: il badge legge il signal condiviso del service,
             aggiornato da OGNI operazione ovunque avvenga -->
        <a routerLink="/checkout" class="carrello-top" aria-label="Carrello">
          <mat-icon>shopping_cart</mat-icon>
          @if (carrelloS.carrelloCorrente(); as c) {
            @if (c.numeroArticoli > 0) {
              <span class="badge-carrello">{{ c.numeroArticoli }}</span>
            }
          }
        </a>

        <!-- Chip identita': avatar vero + saluto + saldo. menuOpened
             rinfresca il saldo: quando l'utente guarda, e' fresco. -->
        <button type="button" class="chip-utente" [matMenuTriggerFor]="menuUtente"
                (menuOpened)="portafoglioS.refreshSaldo()">
          <img class="avatar-chip"
               [src]="urlImmagine(authS.utente()?.immagineProfilo) ?? '/avatar-default.svg'"
               alt="">
          <span class="chi-chip">
            <span class="saluto">Ciao, {{ authS.utente()?.username ?? 'utente' }}</span>
            @if (portafoglioS.saldoCorrente() !== null) {
              <span class="saldo-chip">{{ portafoglioS.saldoCorrente() | number:'1.2-2' }} €</span>
            }
          </span>
          <mat-icon class="freccia-chip">expand_more</mat-icon>
        </button>

        <mat-menu #menuUtente="matMenu" xPosition="before">
          <button mat-menu-item routerLink="/account">
            <mat-icon>person</mat-icon><span>Il mio account</span>
          </button>
          <button mat-menu-item routerLink="/account/ordini">
            <mat-icon>local_shipping</mat-icon><span>I miei ordini</span>
          </button>
          <button mat-menu-item routerLink="/account/portafoglio">
            <mat-icon>account_balance_wallet</mat-icon><span>Portafoglio</span>
          </button>
          <button mat-menu-item routerLink="/checkout">
            <mat-icon>shopping_cart</mat-icon><span>Carrello</span>
          </button>
          @if (eAdmin) {
            <button mat-menu-item routerLink="/admin">
              <mat-icon>space_dashboard</mat-icon><span>Plancia admin</span>
            </button>
          }
          <button mat-menu-item (click)="esci()">
            <mat-icon>logout</mat-icon><span>Esci</span>
          </button>
        </mat-menu>
      } @else {
        <a routerLink="/login" class="pulsante-accedi">
          <mat-icon>login</mat-icon>
          <span class="nome-utente">Accedi</span>
        </a>
      }
    </div>
  </div>

  <!-- RIGA CATEGORIE: centrate, si illuminano all'hover -->
  <nav class="riga-categorie">
    @for (c of categorie; track c.path) {
      <a [routerLink]="['/', c.path]" routerLinkActive="attivo" class="link-menu">
        {{ c.label }}
      </a>
    }
  </nav>

</header>

<main class="contenuto-user">
  <router-outlet />
</main>
