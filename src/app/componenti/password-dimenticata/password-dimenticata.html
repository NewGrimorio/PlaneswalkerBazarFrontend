<div class="centro">
  <mat-card class="scheda">
    <mat-card-header>
      <mat-card-title>Password dimenticata</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      @if (esito(); as e) {
        <p class="esito">{{ e }}</p>
        <a routerLink="/login">Torna all'accesso</a>
      } @else {
        <p class="spiega">
          Inserisci l'email del tuo account: ti guideremo a impostare
          una nuova password.
        </p>
        <form (ngSubmit)="invia()">
          <mat-form-field appearance="outline" class="campo">
            <mat-label>Email</mat-label>
            <input matInput type="email" name="email" [(ngModel)]="email" required>
          </mat-form-field>

          @if (errore(); as e) { <p class="errore">{{ e }}</p> }

          <button matButton="filled" type="submit" class="campo" [disabled]="inCorso()">
            {{ inCorso() ? 'Verifica in corso…' : 'Continua' }}
          </button>
        </form>
      }
    </mat-card-content>
    <mat-card-footer class="footer">
      <a routerLink="/login">Torna all'accesso</a>
    </mat-card-footer>
  </mat-card>
</div>
